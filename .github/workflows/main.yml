# Builds the NeoForge 26.3 mod on every push and pull request to 4.0, and keeps the jar as a download on the run.
# The recipes, loot tables and tags are committed under src/generated, so this does not run the data generators.
name: Build

on:
  push:
    branches: [ '4.0' ]
  pull_request:
    branches: [ '4.0' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Validates the Gradle wrapper and caches Gradle's downloads (including Minecraft and NeoForge) between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Read version
        id: version
        run: |
          echo "minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mod=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cfm-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.mod }}
          path: build/libs/*.jar
          if-no-files-found: error
