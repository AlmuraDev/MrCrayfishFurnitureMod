plugins {
    id 'java-library'
    // see https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    // Only the API: the plugin is skipped when JEI isn't installed
    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.14.0.72'
}

// Resources made by the data generators (./gradlew runData)
sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "Furniture ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
        // Writes the recipes, loot tables, tags and advancements to src/generated/resources
        data {
            clientData()
            gameDirectory = project.file('runs/data')
            programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

processResources {
    var expandProps = [
            'version'                      : version,
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_authors'                  : mod_authors,
            'mod_license'                  : mod_license,
            'minecraft_version_range'      : minecraft_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
